name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record the commit being released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Reject an already released version
        run: |
          if git rev-parse -q --verify "refs/tags/${{ inputs.version }}" > /dev/null
          then
            echo "error: tag ${{ inputs.version }} already exists" >&2
            exit 1
          fi
      - name: Install Go
        # Version from mise.toml.
        uses: jdx/mise-action@v4
      - name: Run tests
        run: go test ./...
      # Go cross-compiles, so one runner builds every binary. CGO off so they link statically.
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          for target in darwin/arm64/macos-arm64 linux/arm64/linux-arm64 \
            linux/amd64/linux-x86_64 windows/amd64/windows-x86_64
          do
            IFS=/ read -r goos goarch name <<< "${target}"
            asset="trampoline-${name}"
            mkdir "build-${name}"
            if [[ "${goos}" == windows ]]
            then
              bin=trampoline.exe
            else
              bin=trampoline
            fi
            GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "build-${name}/${bin}" .
            if [[ "${goos}" == windows ]]
            then
              (cd "build-${name}" && zip -q "../dist/${asset}.zip" "${bin}")
              archive="${asset}.zip"
            else
              tar czf "dist/${asset}.tar.gz" -C "build-${name}" "${bin}"
              archive="${asset}.tar.gz"
            fi
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          done
      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
      - name: Open the changelog section
        run: .github/scripts/prepare-release.sh '${{ inputs.version }}'
      # Nothing is committed or tagged until every binary exists, so a failed
      # build leaves main and the tag list untouched and the workflow can just be
      # re-run.
      - name: Save the release edit as a patch
        run: git diff > release.patch
      - name: Upload the patch
        uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release.patch
          if-no-files-found: error

  release:
    name: release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # The binaries were built from prepare's commit. Releasing a main that has
      # moved since would tag a tree nobody built.
      - name: Reject a main that moved during the build
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "${head}" != '${{ needs.prepare.outputs.sha }}' ]]
          then
            echo "error: main moved from ${{ needs.prepare.outputs.sha }} to ${head}" >&2
            exit 1
          fi
      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the changelog section
        run: git apply release.patch && rm release.patch
      - name: Commit and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag "${VERSION}"
          git push origin main
          git push origin "${VERSION}"
      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      # Takes the newest version section, which is the one just prepared.
      - name: Write the release notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        with:
          release_notes_file: notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
