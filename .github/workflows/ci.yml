name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1
      - name: Install Go
        # Version from mise.toml.
        uses: jdx/mise-action@v4
      - name: Run tests
        run: go test ./...
